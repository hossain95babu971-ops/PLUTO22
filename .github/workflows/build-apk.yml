name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Project (If framework used)
        run: npm run build --if-present

      - name: Prepare Web Assets Folder
        run: |
          mkdir -p www
          # Build folder thakle setar file copy korbe
          if [ -d "dist" ]; then cp -r dist/* www/; fi
          if [ -d "build" ]; then cp -r build/* www/; fi
          
          # Root folder-er shob asset, css, js ebong subfolder copy korbe
          cp -r public/* www/ 2>/dev/null || true
          cp -r src/* www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r components www/ 2>/dev/null || true
          cp -r styles www/ 2>/dev/null || true
          cp index.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true

      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
